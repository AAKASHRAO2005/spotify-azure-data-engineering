resources:
  pipelines:
    spotify_gold_dlt_pipeline:
      name: "[${bundle.target}] Spotify Gold DLT Pipeline"
      target: ${bundle.target}
      catalog: ${var.catalog_name}
      target_schema: ${var.schema_gold}
      continuous: false
      development: true
      channel: CURRENT
      libraries:
        - notebook:
            path: ../src/gold/dlt_gold_pipeline.py
      clusters:
        - label: default
          node_type_id: Standard_DS3_v2
          num_workers: 1
          spark_conf:
            spark.databricks.delta.preview.enabled: "true"
      edition: ADVANCED
